# Mirrors flaime-serving's pre-commit hooks (26Q3-REPO-01), plus the epic's
# LoC budget gate as a local hook. No vendor tamper hook — nothing is vendored
# in the demo repo.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  # Pinned to match CI and the locked dev group exactly — a drifting hook
  # reformats differently than CI and the disagreement surfaces as a mystery
  # failure on someone else's PR.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mirrors-mypy publishes no 2.x tag, so this cannot match the locked mypy
  # (2.3.0) the way ruff does. v1.19.1 is the closest available; CI's
  # `uv run mypy` is authoritative when the two disagree.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        # tests/ included (matching serving): CI type-checks tests/, and the
        # local gate must catch what CI enforces.
        additional_dependencies: [pytest, numpy]
        args: [--ignore-missing-imports, --no-strict-optional, --explicit-package-bases]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: loc-budget
        name: LoC budget gate (scope guardrail)
        entry: bash scripts/check_loc_budget.sh
        language: system
        always_run: true
        pass_filenames: false
