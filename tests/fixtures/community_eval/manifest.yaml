# Community-eval fixture manifest — real LibriSpeech test-clean excerpt
# (26Q3-REPO-12 Part 2).
#
# NOT the real community-representative sample set described in FLAIME's
# 26Q1-DEMO-05 (still NOT STARTED upstream: no CLI wiring, no real manifest,
# no writeup). This fixture exercises scripts/run_community_eval.py against
# real speech without touching any data-sovereignty-sensitive community
# audio: all 8 clips are excerpted from LibriSpeech test-clean, a public
# corpus of read English audiobooks, licensed CC BY 4.0.
#
# Citation: V. Panayotov, G. Chen, D. Povey and S. Khudanpur, "Librispeech:
# An ASR corpus based on public domain audiobooks," ICASSP 2015.
# https://www.openslr.org/12/
#
# Regenerate with: tests/fixtures/community_eval/fetch_librispeech_samples.sh
#
# Schema matches Sample in scripts/run_community_eval.py:
#   audio_path      — relative to this manifest's directory
#   language        — BCP-47 code
#   reference_text  — LibriSpeech ground-truth transcript, lowercased (no
#                      other normalization — matches upstream punctuation-free
#                      transcription convention)
#   category        — golden (plain narration) | edge (proper nouns — harder
#                      to decode than common vocabulary)
#   licensing_note  — provenance; mandatory per Sample's schema
#
# Filename -> source LibriSpeech utterance ID (speaker-chapter-utterance):
#   golden_001.wav  6930-75918-0000
#   golden_002.wav  6930-75918-0002
#   golden_003.wav  6930-75918-0007
#   golden_004.wav  6930-75918-0010
#   golden_005.wav  6930-76324-0001
#   edge_001.wav    6930-75918-0008
#   edge_002.wav    6930-76324-0000
#   edge_003.wav    6930-76324-0007

