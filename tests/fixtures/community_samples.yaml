# DEMO-05 community-representative evaluation manifest.
#
# Ported verbatim from FLAIME's tests/demo/community_samples.yaml (landed
# upstream in 8b28a4b, "26Q1-DEMO-05 (Part 2): serving wiring + CLI + manifest
# + writeup") — the real production manifest for scripts/run_community_eval.py's
# --manifest flag, distinct from tests/fixtures/community_eval/manifest.yaml
# (this repo's own CI-committed real-audio fixture, used where evaluate_samples
# needs actual audio bytes to run against in tests). All 10 language codes used
# here are present in this repo's configs/demo_languages.yaml.
#
# Sovereignty rules (non-negotiable — see the task def):
#   - NO contributor audio bytes are committed to this repo. `audio_path` is
#     relative to a documented external samples root passed via --samples-root
#     (a cluster path or partner-licensed bucket).
#   - Every sample MUST carry a `licensing_note`; load_manifest() fails fast on
#     a missing one. Use CV-CC0 for Common Voice CC0 clips, "synthesized" for
#     TTS, or "contributor-recorded (consent on file)" for consented audio.
#   - No NEW partner recordings are sourced for this test (task def: evaluation,
#     not collection). All 15 clips are currently synthesized (espeak-ng TTS,
#     produced to match reference_text); swapping golden/transfer to real
#     CV-CC0 clips is a fidelity upgrade — update licensing_note if you do.
#
# Categories:
#   golden   — well-supported demo languages (expert or merged checkpoint)
#   transfer — lower-resource demo languages served by the merged checkpoint only
#   edge     — codeswitch / noise / numbers / accent variants (the partner-felt
#              failure modes); WER here matters more than the golden aggregate.
#
# All language codes below are present in configs/demo_languages.yaml,
# so every sample routes through the production LanguageRouter.

samples:
  # --- golden: 5 well-supported demo languages -----------------------------
  - audio_path: golden/en_common_voice_0001.wav
    language: en
    reference_text: the quick brown fox jumps over the lazy dog
    category: golden
    licensing_note: synthesized (espeak-ng TTS)
